apply plugin: 'com.android.application'

android {
    namespace "net.freyta.smw.wear"
    compileSdkVersion 34
    ndkVersion '25.2.9519653'

    defaultConfig {
        applicationId "net.freyta.smw.wear"
        minSdkVersion 30
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0-wear"
        externalNativeBuild {
            ndkBuild {
                arguments "APP_PLATFORM=android-23"
                abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets.main {
        java.srcDirs = ['src/main/java', '../app/src/main/java/org/libsdl/app']
        jniLibs.srcDir '../app/libs'
    }

    externalNativeBuild {
        ndkBuild {
            path '../app/jni/Android.mk'
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core:1.9.0'
    implementation 'com.google.zxing:core:3.5.3'
}
